<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Receptionist — Backend Guide v3</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F1;color:#1A1714;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1A1714;color:#FAF8F4;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.topbar-dot{width:8px;height:8px;background:#D97706;border-radius:50%}
.topbar-title{font-size:13px;color:#8A7866}
.topbar-badge{background:rgba(217,119,6,.18);border:1px solid rgba(217,119,6,.35);color:#D97706;border-radius:100px;padding:3px 11px;font-size:10.5px;font-weight:700;letter-spacing:.8px}
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:215px;flex-shrink:0;background:#fff;border-right:1px solid #E5E0D8;overflow-y:auto;padding:12px 0}
.sidebar-section{font-size:9.5px;font-weight:700;color:#B0A090;text-transform:uppercase;letter-spacing:1.5px;padding:14px 14px 5px}
.nav-btn{width:100%;text-align:left;background:none;border:none;border-left:2.5px solid transparent;padding:8px 14px;cursor:pointer;font-size:12.5px;color:#6A5E50;display:flex;align-items:center;gap:9px;transition:all .12s;font-family:inherit}
.nav-btn:hover{background:#FAF8F4;color:#1A1714}
.nav-btn.active{background:#FAF8F4;color:#D97706;font-weight:600;border-left-color:#D97706}
.nav-num{font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;background:#EDE9E3;color:#8A7866;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-btn.active .nav-num{background:#D97706;color:#fff}
.nav-new{font-size:9px;font-weight:700;background:#D97706;color:#fff;border-radius:4px;padding:1px 5px;margin-left:auto}
.nav-upd{font-size:9px;font-weight:700;background:#059669;color:#fff;border-radius:4px;padding:1px 5px;margin-left:auto}
.main{flex:1;overflow-y:auto;padding:24px 28px 60px;max-width:880px}
.sec-eye{font-size:10px;font-weight:700;color:#D97706;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.sec-title{font-size:22px;font-weight:800;color:#1A1714;letter-spacing:-.5px;margin-bottom:4px}
.sec-sub{font-size:13px;color:#6A5E50;line-height:1.65;margin-bottom:22px}
.block{margin-bottom:22px}
.block-label{font-size:10px;font-weight:700;color:#8A7866;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
pre{background:#1A1714;border-radius:10px;padding:16px 18px;font-size:11.5px;line-height:1.75;color:#E8E4DE;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;overflow-x:auto;white-space:pre;position:relative}
.copy-btn{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);border-radius:5px;padding:3px 9px;font-size:10.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.copy-btn:hover{background:rgba(255,255,255,.18);color:rgba(255,255,255,.85)}
.copy-btn.copied{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.4);color:#10B981}
.info-list{background:#fff;border:1px solid #E5E0D8;border-radius:10px;overflow:hidden}
.info-row{padding:9px 14px;border-bottom:1px solid #F0ECE5;font-size:12.5px;color:#4A4038;line-height:1.55}
.info-row:last-child{border-bottom:none}
.info-row.ok{color:#059669}
.info-row.warn{color:#D97706}
.info-row.err{color:#DC2626}
.info-row strong{color:#1A1714}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #E5E0D8}
th{background:#FAF8F4;padding:9px 12px;text-align:left;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8A7866;border-bottom:1px solid #E5E0D8}
td{padding:9px 12px;border-bottom:1px solid #F0ECE5;color:#4A4038;vertical-align:top}
td:first-child{color:#D97706;font-weight:600;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:none}
.arch-box{background:#1A1714;border-radius:10px;padding:16px 18px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:#10B981;line-height:1.7;overflow-x:auto;white-space:pre}
.alert{border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.alert-gold{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);color:#92400E}
.alert-green{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);color:#065F46}
.alert-red{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);color:#991B1B}
.alert strong{font-weight:700}
.divider{border:none;border-top:1px solid #E5E0D8;margin:24px 0}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-card{background:#fff;border:1px solid #E5E0D8;border-radius:10px;padding:14px}
.mini-card-title{font-size:11.5px;font-weight:700;color:#1A1714;margin-bottom:8px}
.mini-card-row{font-size:11.5px;color:#4A4038;line-height:1.9}
@media(max-width:700px){.shell{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid #E5E0D8}.main{padding:18px 16px 48px}.col2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><div class="topbar-dot"></div>Link2Talent <span class="topbar-title">— Backend Guide</span></div>
  <span class="topbar-badge">v3 · Refined 2026</span>
</div>

<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <p style="padding:40px 20px;color:#999;font-size:13px">Loading sections…</p>
  </div>
</div>

<script>
window.SECTIONS = {};

const NAV = [
  {id:"arch",      label:"Architecture",       group:"Overview"},
  {id:"stack",     label:"Tech Stack",         group:"Overview"},
  {id:"setup",     label:"Project Setup",      num:"1"},
  {id:"claude",    label:"Claude AI Core",     num:"2"},
  {id:"memory",    label:"Memory & Context",   num:"3"},
  {id:"chat",      label:"Chat + SMS",         num:"4"},
  {id:"voice",     label:"Voice Pipeline",     num:"5", isNew:true},
  {id:"appts",     label:"Appointments",       num:"6"},
  {id:"leads",     label:"Lead Capture",       num:"7"},
  {id:"kb",        label:"Knowledge Base",     num:"8"},
  {id:"onboard",   label:"Client Onboarding",  num:"9"},
  {id:"dashboard", label:"Dashboard API",      num:"10"},
  {id:"deploy",    label:"Deployment",         num:"11"},
  {id:"security",  label:"Security",           num:"12"},
];

function cp(btn) {
  const pre = btn.parentElement;
  const clone = pre.cloneNode(true);
  clone.querySelector('.copy-btn')?.remove();
  const code = clone.innerText.trim();
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function render(id) {
  const sec = window.SECTIONS[id];
  if (!sec) {
    document.getElementById('main').innerHTML =
      '<p style="padding:40px 20px;color:#DC2626;font-size:13px">Section "' + id + '" not found. Check that sections_p1.js and sections_p2.js loaded.</p>';
    return;
  }
  document.getElementById('main').innerHTML = sec;
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id));
  document.getElementById('main').scrollTo(0, 0);
}
</script>

<script src="sections_p1.js"></script>
<script src="sections_p2.js"></script>

<script>
(function init() {
  const sidebar = document.getElementById('sidebar');
  let curGroup = '';
  NAV.forEach(item => {
    if (item.group && item.group !== curGroup) {
      curGroup = item.group;
      const s = document.createElement('div');
      s.className = 'sidebar-section';
      s.textContent = curGroup;
      sidebar.appendChild(s);
    }
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.dataset.id = item.id;
    btn.onclick = () => render(item.id);
    let inner = '';
    if (item.num) inner += '<span class="nav-num">' + item.num + '</span>';
    inner += item.label;
    if (item.isNew) inner += ' <span class="nav-new">NEW</span>';
    if (item.isUpd) inner += ' <span class="nav-upd">UPD</span>';
    btn.innerHTML = inner;
    sidebar.appendChild(btn);
  });
  render('arch');
})();
</script>
</body>
</html>

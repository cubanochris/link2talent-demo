<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>AI Digital Receptionist — Pricing & Savings</title>
<style>
:root{--bg:#0F0D0A;--bg2:#181410;--border:#3C2E20;--text:#FAF8F4;--muted:#8A7866;--dim:#6A5E4E;--mint:#D97706;--teal:#C46610;--green:#22C55E;--purple:#7C3AED;--gold:#D97706;--red:#F43F5E;--r:14px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input{font-family:inherit}
.hero{background:linear-gradient(160deg,#0A2540 0%,#8A4800 55%,#C46610 100%);padding:48px 20px 38px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(217,119,6,.12);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-70px;left:-40px;width:190px;height:190px;border-radius:50%;background:rgba(140,70,0,.18);pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:640px;margin:0 auto}
.badge{display:inline-block;background:rgba(217,119,6,.18);border:1px solid rgba(217,119,6,.4);border-radius:100px;padding:5px 16px;font-size:11px;color:#D97706;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,6vw,38px);font-weight:800;color:#FAF8F4;letter-spacing:-1.5px;margin-bottom:10px;line-height:1.1}
.hero p{font-size:clamp(13px,3.5vw,16px);color:rgba(255,255,255,.7);margin-bottom:28px;max-width:480px;margin-left:auto;margin-right:auto}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 8px;max-width:500px;margin:0 auto}
.stat-val{font-size:clamp(16px,4vw,22px);font-weight:800;color:#D97706}
.stat-lbl{font-size:clamp(9px,2.5vw,11px);color:rgba(255,255,255,.5);margin-top:2px}
.tab-wrap{padding:18px 16px 0;max-width:980px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar{display:flex;gap:8px;padding-bottom:4px;min-width:max-content}
.tab-btn{padding:9px 18px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg2);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff}
.content{max-width:980px;margin:0 auto;padding:22px 16px 64px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr 1fr}.stats-bar{grid-template-columns:1fr 1fr}.tab-wrap{padding:14px 12px 0}}
@media(max-width:480px){.plan-grid{grid-template-columns:1fr}}
.plan-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--r);overflow:hidden;transition:transform .2s,box-shadow .2s}
.plan-card:hover{transform:translateY(-3px)}
.plan-badge{padding:6px 0;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.plan-body{padding:18px 16px}
.feat-item{display:flex;gap:7px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border);line-height:1.4}
.feat-item:last-child{border-bottom:none}
.slider-wrap{margin-bottom:18px}
.slider-row{display:flex;justify-content:space-between;margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.2)}
.res-box{border-radius:var(--rs);padding:16px;margin-bottom:12px;border:1px solid}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px}
.res-row:last-child{border-bottom:none}
.navy-box{background:#120E0A;border-radius:var(--r);padding:18px;margin:14px 0}
.n-lbl{font-size:10px;color:rgba(255,255,255,.4);margin-bottom:4px}
.n-val{font-size:clamp(18px,4vw,24px);font-weight:800}
.grad-box{background:linear-gradient(135deg,#C46610,#C46610);border-radius:var(--r);padding:18px;text-align:center;margin-top:14px}
.cov-bar{display:flex;gap:3px;margin:10px 0;border-radius:4px;overflow:hidden}
.cov-on{height:14px;background:#C46610;border-radius:3px 0 0 3px}
.cov-off{height:14px;background:#F43F5E;border-radius:0 3px 3px 0}
.cov-lbl{display:flex;justify-content:space-between;font-size:11px}
.cmp-table{width:100%;border-collapse:collapse;font-size:clamp(11px,3vw,13px);min-width:460px}
.cmp-table th{padding:10px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#120E0A}
.cmp-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:500px){.addon-grid{grid-template-columns:1fr}}
.addon-card{background:var(--bg2);border:2px solid var(--border);border-radius:var(--rs);padding:14px;cursor:pointer;transition:all .18s;-webkit-user-select:none;user-select:none}
.addon-card.sel{border-color:var(--teal);background:rgba(196,102,16,.1)}
.total-box{background:#120E0A;border-radius:var(--r);padding:20px}
.t-line{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--muted)}
.t-div{border:none;border-top:1px solid var(--border);margin:12px 0}
.cta-btn{width:100%;padding:15px 0;border-radius:var(--rs);background:#D97706;border:none;color:#120E0A;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px;letter-spacing:.3px}
.psel-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.psel-btn{flex:1;min-width:80px;padding:10px 4px;border-radius:var(--rs);border:2px solid var(--border);background:var(--bg2);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;text-align:center;transition:all .15s}
.sec-eye{font-size:10.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.sec-title{font-size:clamp(18px,4.5vw,24px);font-weight:800;color:var(--text);margin-bottom:6px}
.sec-sub{font-size:clamp(12px,3vw,14px);color:var(--muted);margin-bottom:22px}
.annual-bar{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.25);border-radius:var(--rs);padding:14px 16px;text-align:center;margin-top:16px}
.cost-card{border-radius:var(--r);padding:20px;border:1px solid}
.bar-wrap{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:4px}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="badge">&#9679; Powered by Link2Talent + Claude AI</div>
    <h1>AI Digital Receptionist</h1>
    <p>Always on. Always professional. Your front desk &mdash; fully automated, 24/7, at a fraction of the cost.</p>
    <div class="stats-bar">
      <div style="text-align:center"><div class="stat-val">24/7</div><div class="stat-lbl">Availability</div></div>
      <div style="text-align:center"><div class="stat-val">&lt;1s</div><div class="stat-lbl">Response</div></div>
      <div style="text-align:center"><div class="stat-val">$0</div><div class="stat-lbl">Sick days</div></div>
      <div style="text-align:center"><div class="stat-val">3&times;</div><div class="stat-lbl">More leads</div></div>
    </div>
  </div>
</div>
<div class="tab-wrap"><div class="tab-bar" id="TB"></div></div>
<div class="content" id="CT"></div>
<script>
var PLANS = [
  {id:"starter",name:"Starter",tagline:"Solo operators & small shops",
   price:497,setup:1200,color:"#A86000",light:"rgba(180,83,9,.12)",dark:"#FDE68A",
   channels:["Website Chat","SMS"],
   features:["AI receptionist 24/7/365","Up to 800 conversations/mo","Instant FAQ answering","Automatic lead capture","Custom knowledge base (50 topics)","New lead email alerts","Monthly performance report","7-day setup & onboarding"],
   no:["Appointment booking","CRM integration","Voice/Phone channel"]},
  {id:"professional",name:"Professional",tagline:"Most popular for service businesses",
   price:997,setup:3500,color:"#C46610",light:"rgba(196,102,16,.12)",dark:"#F0A020",popular:true,
   channels:["Website Chat","SMS","Phone/Voice"],
   features:["AI receptionist 24/7/365","Up to 3,000 conversations/mo","Appointment booking & calendar sync","Google Calendar integration","CRM lead sync (HubSpot)","Custom knowledge base (200 topics)","Lead capture & instant alerts","Priority support (4-hr response)","Bi-weekly performance dashboard","7-day setup & onboarding"],
   no:["Multi-location","Custom integrations","White-label"]},
  {id:"bizpro",name:"Business Pro",tagline:"Growing multi-location businesses",
   price:1997,setup:6500,color:"#4F46E5",light:"rgba(79,70,229,.12)",dark:"#A5B4FC",hot:true,
   channels:["Website Chat","SMS","Phone/Voice","Up to 3 Locations"],
   features:["AI receptionist 24/7/365","Up to 8,000 conversations/mo","Everything in Professional","Up to 3 locations supported","Advanced analytics dashboard","Custom CRM integration","Dedicated onboarding specialist","Monthly strategy call","99.5% uptime SLA","7-day setup & onboarding"],
   no:["Unlimited locations","Full white-label","Custom API builds"]},
  {id:"enterprise",name:"Enterprise",tagline:"Multi-location & high-volume",
   price:3997,setup:15000,color:"#7C3AED",light:"rgba(124,58,237,.12)",dark:"#C4B5FD",
   channels:["Website Chat","SMS","Phone/Voice","Unlimited Locations"],
   features:["AI receptionist 24/7/365","Unlimited conversations","All Business Pro features","Unlimited locations","Custom API integrations","Full white-label branding","Dedicated account manager","Custom AI brand training","99.9% SLA guarantee","Weekly strategy calls","Full analytics suite"],
   no:[]}
];

var ADDONS = [
  {name:"Voice / Phone Channel",price:150,desc:"Full AI phone receptionist — answers calls, books appointments"},
  {name:"Additional Location",price:297,desc:"Separate AI receptionist per location, same admin dashboard"},
  {name:"White-Label Branding",price:500,desc:"Your brand name, colors & logo on all customer touchpoints"},
  {name:"Multilingual Support",price:99,desc:"Add Spanish, French, or any language (per language)"},
  {name:"Analytics Dashboard",price:149,desc:"Deep reports: top questions, conversion rates, peak hours"},
  {name:"Priority 24/7 SLA",price:499,desc:"1-hour response guarantee, 24/7 emergency line, dedicated manager"}
];

var CMP = [
  ["Availability","Business hours only","24 / 7 / 365",true],
  ["Response time","Seconds to minutes","Under 1 second",false],
  ["Simultaneous chats","1 at a time","Unlimited",true],
  ["After-hours coverage","None","Full coverage",false],
  ["Consistency","Varies by day/mood","Always professional",true],
  ["Sick days & turnover","Disrupts operations","Zero downtime",false],
  ["Lead capture","Depends on staff","Every inquiry captured",true],
  ["Training required","Weeks + ongoing","One-time 7-day setup",false],
  ["Monthly cost","$3,500-$5,000+","From $497/mo",true]
];

var TABS=[{id:"plans",l:"Plans & Pricing"},{id:"savings",l:"Staff Calculator"},{id:"afterhours",l:"After-Hours Revenue"},{id:"compare",l:"AI vs. Human"},{id:"addons",l:"Add-Ons"}];
var tab="plans",selPlan="professional",selAddons=[];
var sStaff=1,sWage=18,sHours=40,sMissed=30,sJobVal=250,sClose=40;
var aHrs=9,aDInq=15,aJV=300,aCl=35;

function fmt(n){return "$"+Math.round(n).toLocaleString();}
function el(id){return document.getElementById(id);}
function setTab(id){tab=id;renderTabs();renderContent();el("CT").scrollIntoView({behavior:"smooth",block:"start"});}
function renderTabs(){el("TB").innerHTML=TABS.map(function(t){return'<button class="tab-btn'+(tab===t.id?" active":"")+'" onclick="setTab(\''+t.id+'\')">'+t.l+"</button>";}).join("");}

function renderPlans(){
  var html='<div style="text-align:center;margin-bottom:24px"><div class="sec-eye">Pricing</div><div class="sec-title">Simple, Transparent Pricing</div><div class="sec-sub">All plans include 7-day setup &amp; onboarding. No hidden fees.</div></div><div class="plan-grid">';
  PLANS.forEach(function(p){
    var isFeat=p.popular||p.hot;
    html+='<div class="plan-card" style="border-color:'+(isFeat?p.color:"var(--border)")+';'+(isFeat?"box-shadow:0 8px 28px "+p.color+"33;":"")+'">';
    if(p.popular) html+='<div class="plan-badge" style="background:'+p.color+';color:#fff">&#10022; Most Popular</div>';
    if(p.hot)     html+='<div class="plan-badge" style="background:'+p.color+';color:#fff">&#11088; Best Value</div>';
    html+='<div class="plan-body">'
      +'<div style="font-size:17px;font-weight:800;color:'+p.color+';margin-bottom:3px">'+p.name+'</div>'
      +'<div style="font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.4">'+p.tagline+'</div>'
      +'<div><span style="font-size:clamp(26px,5vw,36px);font-weight:800;color:var(--text)">$'+p.price.toLocaleString()+'</span><span style="font-size:13px;color:var(--muted)">/mo</span></div>'
      +'<div style="font-size:11.5px;color:var(--dim);margin:3px 0 14px">Setup: <strong style="color:var(--muted)">$'+p.setup.toLocaleString()+'</strong></div>'
      +'<div style="background:'+p.light+';border-radius:7px;padding:9px 11px;margin-bottom:12px">'
      +'<div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:'+p.dark+';margin-bottom:5px">Channels Included</div>'
      +p.channels.map(function(c){return'<div style="font-size:11.5px;color:'+p.dark+';padding:2px 0">&#10003; '+c+'</div>';}).join("")+'</div><div>';
    p.features.forEach(function(f){html+='<div class="feat-item"><span style="font-weight:700;color:'+p.color+';flex-shrink:0">&#10003;</span><span>'+f+'</span></div>';});
    p.no.forEach(function(f){html+='<div class="feat-item"><span style="color:var(--dim);flex-shrink:0">&mdash;</span><span style="color:var(--dim)">'+f+'</span></div>';});
    html+='</div><button style="width:100%;padding:12px 0;border-radius:7px;border:2px solid '+p.color+';background:'+(isFeat?p.color:"transparent")+';color:'+(isFeat?"#fff":p.color)+';font-weight:700;font-size:13.5px;cursor:pointer;margin-top:14px;font-family:inherit">Get Started &rarr;</button></div></div>';
  });
  html+='</div><div class="annual-bar"><strong style="color:#D97706">&#128176; Pay Annually &amp; Save Up to 20%</strong> &mdash; Lock in your rate and save hundreds per year. Ask us about annual pricing.</div>';
  return html;
}

function renderSavings(){
  var wages=sStaff*sWage*sHours*4.33,ben=wages*.28,tr=200,rec=sStaff>1?292:0,tot=Math.round(wages+ben+tr+rec);
  var p=PLANS.filter(function(x){return x.id===selPlan;})[0],ai=p.price,sav=tot-ai,ann=sav*12,pb=sav>0?Math.ceil(p.setup/sav):null;
  var rr=Math.round(sMissed*(sClose/100))*sJobVal,tb=ann+rr*12;
  var pbtns=PLANS.map(function(pl){var a=selPlan===pl.id;return'<button class="psel-btn" style="'+(a?"background:"+pl.color+";border-color:"+pl.color+";color:#fff;":"")+'" onclick="selPlan=\''+pl.id+'\';reCalc()">'+pl.name+'<br><span style="font-size:11px">$'+pl.price.toLocaleString()+'/mo</span></button>';}).join("");
  var sls=[["sStaff","Number of receptionists",1,6,1,sStaff,"",p.color],["sWage","Avg hourly wage",10,45,1,sWage,"$",p.color],["sHours","Hours / week",20,50,5,sHours,"",p.color],["sMissed","Missed inquiries / mo",0,200,5,sMissed,"",p.color],["sJobVal","Avg customer value",50,2000,25,sJobVal,"$",p.color],["sClose","Lead close rate (%)",5,80,5,sClose,"",p.color]].map(function(s){var key=s[0],lbl=s[1],min=s[2],max=s[3],step=s[4],val=s[5],pre=s[6],ac=s[7];var disp=key==="sClose"?val+"%":(pre?pre+Number(val).toLocaleString():Number(val).toLocaleString());return'<div class="slider-wrap"><div class="slider-row"><span style="font-size:12.5px;color:var(--muted)">'+lbl+'</span><span style="font-size:14px;font-weight:700;color:var(--text)">'+disp+'</span></div><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" style="accent-color:'+ac+'" oninput="'+key+'=+this.value;reCalc()"></div>';}).join("");
  var cr=[["Base wages",fmt(Math.round(wages))],["Benefits & payroll (28%)",fmt(Math.round(ben))],["Training costs",fmt(Math.round(tr))],["Avg recruitment",fmt(Math.round(rec))]].map(function(r){return'<div class="res-row"><span style="color:#FDA4AF">'+r[0]+'</span><span style="font-weight:700;color:#F87171">'+r[1]+'</span></div>';}).join("");
  return'<div style="text-align:center;margin-bottom:22px"><div class="sec-eye">Calculator</div><div class="sec-title">How Much Could You Save?</div><div class="sec-sub">Drag the sliders to match your situation &mdash; see your savings instantly.</div></div>'
    +'<div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Compare against which plan?</div><div class="psel-row">'+pbtns+'</div></div>'
    +'<div class="two-col"><div><div class="card"><div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px">Your Current Setup</div>'+sls+'</div></div><div>'
    +'<div class="res-box" style="background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.2)">'
    +'<div style="font-size:10.5px;font-weight:700;color:#F87171;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Current Staff Cost / Month</div>'+cr
    +'<div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:2px solid #F43F5E;font-size:15px;font-weight:800;color:#F43F5E"><span>Total Staff Cost</span><span>'+fmt(tot)+'/mo</span></div></div>'
    +'<div class="res-box" style="background:rgba(196,102,16,.08);border-color:rgba(196,102,16,.25)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:10.5px;font-weight:700;color:#F0A020;text-transform:uppercase;letter-spacing:.8px">AI Receptionist ('+p.name+')</div><div style="font-size:11px;color:#22C55E;margin-top:2px">24/7 &middot; all channels &middot; never calls in sick</div></div><div style="font-size:22px;font-weight:800;color:#F0A020;flex-shrink:0">'+fmt(ai)+'/mo</div></div></div>'
    +'<div class="navy-box"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Your Savings</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'
    +[["Monthly savings",(sav>0?"+":"")+fmt(sav),sav>0?"#22C55E":"#F43F5E"],["Annual savings",(ann>0?"+":"")+fmt(ann),ann>0?"#22C55E":"#F43F5E"],["Setup pays back",pb?pb+" mo":"&mdash;","#D97706"],["Recovered rev/mo","+"+fmt(rr),"#A78BFA"]].map(function(x){return'<div><div class="n-lbl">'+x[0]+'</div><div class="n-val" style="color:'+x[2]+'">'+x[1]+'</div></div>';}).join("")
    +'</div></div><div class="grad-box"><div style="font-size:11px;color:rgba(255,255,255,.8);margin-bottom:4px">Total Annual Benefit (savings + recovered revenue)</div><div style="font-size:clamp(26px,6vw,36px);font-weight:800;color:#fff">'+fmt(tb)+'</div><div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:4px">compared to your current setup</div></div></div></div>';
}

function renderAfterHours(){
  var gap=24-aHrs,pct=Math.round((gap/24)*100),md=Math.round(aDInq*(gap/24)),mm=md*26,cv=Math.round(mm*(aCl/100)),lr=cv*aJV;
  var sls=[["aHrs","Hours open per day",4,16,1,aHrs,"hrs","#7C3AED"],["aDInq","Inquiries per day",2,100,1,aDInq,"","#7C3AED"],["aJV","Avg new customer value",50,5000,50,aJV,"$","#7C3AED"],["aCl","Lead close rate (%)",5,80,5,aCl,"","#7C3AED"]].map(function(s){var key=s[0],lbl=s[1],min=s[2],max=s[3],step=s[4],val=s[5],suf=s[6],ac=s[7];var disp=key==="aCl"?val+"%":(key==="aJV"?"$"+Number(val).toLocaleString():Number(val).toLocaleString()+(suf?" "+suf:""));return'<div class="slider-wrap"><div class="slider-row"><span style="font-size:12.5px;color:var(--muted)">'+lbl+'</span><span style="font-size:14px;font-weight:700;color:var(--text)">'+disp+'</span></div><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" style="accent-color:'+ac+'" oninput="'+key+'=+this.value;reCalc()"></div>';}).join("");
  return'<div style="text-align:center;margin-bottom:22px"><div class="sec-eye">Revenue Recovery</div><div class="sec-title">How Much Are You Losing After Hours?</div><div class="sec-sub">Every unanswered inquiry is a customer lost to a competitor who answered.</div></div>'
    +'<div class="two-col"><div><div class="card"><div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px">Your Business</div>'+sls
    +'<div class="navy-box" style="margin-top:8px"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Coverage Gap</div>'
    +'<div class="cov-bar"><div class="cov-on" style="flex:'+aHrs+';transition:flex .4s"></div><div class="cov-off" style="flex:'+gap+';transition:flex .4s"></div></div>'
    +'<div class="cov-lbl"><span style="color:#C46610">&#10003; Covered '+aHrs+'hrs</span><span style="color:#F43F5E">&#10007; Missed '+gap+'hrs ('+pct+'%)</span></div></div></div></div>'
    +'<div><div class="navy-box" style="margin-bottom:12px"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">What You\'re Missing</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +[["After-hours %",pct+"%","#D97706"],["Missed/day",md,"#F43F5E"],["Missed/month",mm.toLocaleString(),"#F43F5E"],["Lost customers/mo",cv,"#F43F5E"]].map(function(x){return'<div><div class="n-lbl">'+x[0]+'</div><div class="n-val" style="color:'+x[2]+'">'+x[1]+'</div></div>';}).join("")+'</div></div>'
    +'<div class="res-box" style="background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.2);margin-bottom:12px"><div style="font-size:10.5px;font-weight:700;color:#F87171;margin-bottom:5px">Monthly Revenue Left on the Table</div>'
    +'<div style="font-size:clamp(28px,7vw,38px);font-weight:800;color:#F43F5E">'+fmt(lr)+'</div>'
    +'<div style="font-size:11px;color:#FDA4AF;margin-top:4px">'+mm.toLocaleString()+' missed &times; '+aCl+'% close &times; '+fmt(aJV)+' value</div></div>'
    +'<div class="res-box" style="background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25)"><div style="font-size:10.5px;font-weight:700;color:#6EE7B7;margin-bottom:5px">With AI Receptionist &mdash; Recovered Annually</div>'
    +'<div style="font-size:clamp(28px,7vw,38px);font-weight:800;color:#22C55E">'+fmt(lr*12)+'</div>'
    +'<div style="font-size:11px;color:#22C55E;margin-top:4px">Your AI answers every inquiry &mdash; nights, weekends, holidays</div></div></div></div>';
}

function renderCompare(){
  var rows=CMP.map(function(r,i){return'<tr style="background:'+(r[3]?"rgba(196,102,16,.07)":i%2===0?"var(--bg2)":"var(--bg)")+'"><td style="font-weight:'+(r[3]?700:400)+';color:var(--text)">'+r[0]+'</td><td style="text-align:center;color:var(--muted)">'+r[1]+'</td><td style="text-align:center;color:#C46610;font-weight:600">'+r[2]+'</td></tr>';}).join("");
  var hc=[["Base salary","$31,200&ndash;$45,000/yr"],["Payroll taxes (~15%)","$4,700&ndash;$6,750/yr"],["Health insurance","$6,000&ndash;$12,000/yr"],["PTO & sick days","$1,800&ndash;$2,600/yr"],["Training & onboarding","$1,500&ndash;$3,000/yr"],["Avg recruitment","$2,500&ndash;$5,000/yr"]].map(function(r){return'<div class="res-row"><span style="color:#FDA4AF">'+r[0]+'</span><span style="font-weight:700;color:#F87171">'+r[1]+'</span></div>';}).join("");
  var ac=[["Monthly subscription (Pro)","$997/mo"],["Setup fee (amortized yr 1)","$292/mo"],["Training","$0"],["Benefits & payroll taxes","$0"],["Sick days / turnover","$0"],["Recruitment fees","$0"]].map(function(r){return'<div class="res-row"><span style="color:#FDE68A">'+r[0]+'</span><span style="font-weight:700;color:'+(r[1]==="$0"?"#D97706":"#F0A020")+'">'+r[1]+'</span></div>';}).join("");
  return'<div style="text-align:center;margin-bottom:22px"><div class="sec-eye">Comparison</div><div class="sec-title">AI vs. Human Receptionist</div><div class="sec-sub">An honest side-by-side look at what you get with each option.</div></div>'
    +'<div style="border-radius:var(--r);overflow:hidden;border:1px solid var(--border);margin-bottom:20px;overflow-x:auto"><table class="cmp-table"><thead><tr><th style="text-align:left;color:var(--muted)">Feature</th><th style="text-align:center;color:#F87171">Human Receptionist</th><th style="text-align:center;color:#D97706">AI Receptionist</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="two-col"><div class="cost-card" style="background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.2)"><div style="font-size:14px;font-weight:700;color:#F87171;margin-bottom:14px">True Cost &mdash; Human Receptionist</div>'+hc+'<div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:2px solid #F43F5E;font-size:15px;font-weight:800;color:#F43F5E"><span>Total Annual</span><span>$47K&ndash;$74K</span></div></div>'
    +'<div class="cost-card" style="background:rgba(196,102,16,.08);border-color:rgba(196,102,16,.2)"><div style="font-size:14px;font-weight:700;color:#F0A020;margin-bottom:14px">True Cost &mdash; AI Receptionist</div>'+ac+'<div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:8px;border-top:2px solid #C46610;font-size:15px;font-weight:800;color:#C46610"><span>Total Year 1</span><span>$15,464</span></div><div style="font-size:11.5px;color:#22C55E;margin-top:8px">Year 2+: $11,964/yr &middot; Save $35K&ndash;$62K annually</div></div></div>';
}

function renderAddons(){
  var base=PLANS.filter(function(p){return p.id===selPlan;})[0];
  var aT=selAddons.reduce(function(s,n){var a=ADDONS.filter(function(x){return x.name===n;})[0];return s+(a?a.price:0);},0),tot=base.price+aT;
  var pbtns=PLANS.map(function(p){var a=selPlan===p.id;return'<button class="psel-btn" style="'+(a?"background:"+p.color+";border-color:"+p.color+";color:#fff;":"")+'" onclick="selPlan=\''+p.id+'\';reCalc()">'+p.name+'<br><span style="font-size:11px">$'+p.price.toLocaleString()+'/mo</span></button>';}).join("");
  var cards=ADDONS.map(function(a){var sel=selAddons.indexOf(a.name)!==-1;return'<div class="addon-card'+(sel?" sel":"")+'" onclick="toggleAddon(\''+a.name.replace(/'/g,"\\'")+'\')">'+'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px"><div style="font-size:13px;font-weight:700;color:'+(sel?"#D97706":"var(--text)")+';flex:1">'+a.name+'</div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span style="font-size:13px;font-weight:800;color:'+(sel?"#D97706":"var(--muted)")+'">$'+a.price+'/mo</span><div style="width:20px;height:20px;border-radius:50%;border:2px solid '+(sel?"#D97706":"var(--border)")+';background:'+(sel?"#D97706":"transparent")+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:'+(sel?"#120E0A":"transparent")+'">&#10003;</div></div></div><div style="font-size:11.5px;color:var(--muted);line-height:1.5">'+a.desc+'</div></div>';}).join("");
  var aLines=selAddons.map(function(n){var a=ADDONS.filter(function(x){return x.name===n;})[0];return'<div class="t-line"><span>+ '+n+'</span><span>$'+a.price+'/mo</span></div>';}).join("");
  return'<div style="text-align:center;margin-bottom:22px"><div class="sec-eye">Customize</div><div class="sec-title">Build Your Custom Plan</div><div class="sec-sub">Add exactly what you need. Everything can be changed monthly.</div></div>'
    +'<div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Select a base plan</div><div class="psel-row">'+pbtns+'</div></div>'
    +'<div class="addon-grid">'+cards+'</div>'
    +'<div class="total-box"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">Your Custom Package</div>'
    +'<div class="t-line"><span>'+base.name+' Plan</span><span>$'+base.price.toLocaleString()+'/mo</span></div>'+aLines
    +'<hr class="t-div"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;color:var(--muted)">Monthly total</div><div style="font-size:11px;color:var(--dim);margin-top:2px">+ $'+base.setup.toLocaleString()+' one-time setup</div></div><div style="font-size:clamp(24px,6vw,32px);font-weight:800;color:#D97706">$'+tot.toLocaleString()+'/mo</div></div>'
    +'<button class="cta-btn">Request a Quote &rarr; Link2Talent@outlook.com</button></div>';
}

function reCalc(){renderTabs();renderContent();}
function toggleAddon(name){var idx=selAddons.indexOf(name);if(idx!==-1){selAddons.splice(idx,1);}else{selAddons.push(name);}renderContent();}
function renderContent(){var m={plans:renderPlans,savings:renderSavings,afterhours:renderAfterHours,compare:renderCompare,addons:renderAddons};el("CT").innerHTML=(m[tab]||renderPlans)();}
renderTabs();renderContent();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<style>
:root{--bg:#0F0D0A;--bg2:#181410;--border:#3C2E20;--text:#FAF8F4;--muted:#8A7866;--dim:#6A5E4E;
  --mint:#D97706;--teal:#C46610;--green:#22C55E;--purple:#7C3AED;--gold:#D97706;--red:#F43F5E;--blue:#D97706;--r:14px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button,input{font-family:inherit}
.conf{background:#7C3AED;color:#fff;text-align:center;font-size:11px;font-weight:700;letter-spacing:2px;padding:8px 0;text-transform:uppercase;position:sticky;top:0;z-index:100}
.hero{background:linear-gradient(160deg,#181410 0%,#0A2540 100%);padding:36px 20px 30px;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:rgba(124,58,237,.1);pointer-events:none}
.badge{display:inline-block;background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.5);border-radius:100px;padding:5px 16px;font-size:11px;color:#A78BFA;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(20px,4.5vw,30px);font-weight:800;color:#FAF8F4;letter-spacing:-1.5px;margin-bottom:8px}
.hero p{font-size:clamp(12px,3vw,14px);color:rgba(255,255,255,.55);max-width:540px;margin:0 auto}
.tab-wrap{padding:18px 16px 0;max-width:920px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar{display:flex;gap:8px;padding-bottom:4px;min-width:max-content}
.tab-btn{padding:9px 18px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg2);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.content{max-width:920px;margin:0 auto;padding:20px 16px 64px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.four-col{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:680px){.two-col,.three-col{grid-template-columns:1fr}.four-col{grid-template-columns:1fr 1fr}}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center}
.stat-num{font-size:clamp(20px,4vw,26px);font-weight:800;color:var(--mint)}
.stat-lbl{font-size:10px;color:var(--dim);margin-top:3px}
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
.cost-row:nth-child(odd){background:rgba(255,255,255,.02)}
.cost-row:last-child{border-bottom:none}
table{width:100%;border-collapse:collapse;font-size:clamp(11px,3vw,13px)}
th{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#120E0A;color:var(--mint)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.bar-wrap{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:4px}
.navy{background:#120E0A;border-radius:var(--r);padding:18px;margin:14px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;background:var(--purple);box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2)}
.slider-row-lbl{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12.5px}
.tip{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--rs);padding:14px 16px;margin-bottom:10px}
.clause{background:rgba(255,255,255,.03);border-radius:var(--rs);padding:12px}
.billing-card{border:1.5px solid var(--border);border-radius:var(--rs);overflow:hidden}
.billing-row{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:6px}
.billing-row:last-child{border-bottom:none}
.addon-header{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr;background:#120E0A;padding:10px 14px}
.addon-row{display:grid;grid-template-columns:2.5fr 1fr 1fr 1fr;padding:11px 14px;border-top:1px solid var(--border)}
.sec-eye{font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.sec-title{font-size:clamp(18px,4vw,22px);font-weight:800;color:var(--text);margin-bottom:6px}
.sec-sub{font-size:clamp(12px,3vw,13.5px);color:var(--muted);margin-bottom:20px}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">&#128274; Internal Resource</div>
  <h1>AI Receptionist Pricing &amp; Profit Guide</h1>

</div>
<div class="tab-wrap"><div class="tab-bar" id="TB"></div></div>
<div class="content" id="CT"></div>
<script>

    usage:[["Conversations","300-800 / mo"],["Messages","3,000-8,000 / mo"],["Channels","1 (chat or SMS)"],["Knowledge","Up to 50 FAQs"]],
    costs:[["Claude API","$8","$20"],["Hosting share","$4","$6"],["Twilio SMS + #","$5","$10"],["Redis (free)","Free","Free"],["Supabase (free)","Free","Free"],["Pinecone (free)","Free","Free"],["Your time - support 1hr","$50","$75"]],
    totLo:67,totHi:111,avg:89,
    setup:[["Your time (8 hrs)","$400","$600"],["Infrastructure","$25","$50"],["Knowledge base","$0","$0"]],
    setupLo:425,setupHi:650,clientSetup:1200,clientMo:497,disc:10
  },
  medium:{

    costs:[["Claude API","$30","$85"],["Hosting dedicated","$20","$30"],["Twilio SMS + Voice","$15","$30"],["Redis (paid)","$10","$10"],["Supabase Pro","$25","$25"],["Pinecone starter","$0","$25"],["Your time - support 2hrs","$100","$150"]],

  },

    costs:[["Claude API","$60","$150"],["Hosting dedicated","$25","$40"],["Twilio SMS + Voice","$20","$40"],["Redis (paid)","$10","$25"],["Supabase Pro","$25","$25"],["Pinecone standard","$25","$70"],["Resend (starter)","$20","$20"],["Your time - support 3hrs","$150","$225"]],
    totLo:335,totHi:595,avg:465,

    costs:[["Claude API","$150","$500"],["Dedicated infra","$80","$200"],["Twilio multi-number","$50","$150"],["Redis cluster","$30","$60"],["Postgres dedicated","$50","$100"],["Pinecone standard","$70","$70"],["Resend scale","$20","$50"],["Your time - support 6hrs","$300","$600"],["Custom dev","$200","$500"]],
    totLo:950,totHi:2230,avg:1590,
    setup:[["Your time (60+ hrs)","$3,000","$6,000"],["Dedicated infra","$500","$1,000"],["Knowledge + training","$500","$1,500"],["Custom integrations","$1,000","$3,000"],["QA and load testing","$500","$1,000"]],
    setupLo:5500,setupHi:12500,clientSetup:15000,clientMo:3997,disc:20

  ["Additional Channel (Voice/SMS)","$15-30/mo","$150/mo","80%+"],
  ["Extra Location (same business)","$30-60/mo","$297/mo","75%+"],
  ["White-Label Branding","$0 extra","$500/mo","100%"],
  ["Custom CRM Integration","$200-500 once","$1,500-3,000","70%+"],
  ["Multilingual Support (per lang)","$10-20/mo","$99/mo","80%+"],
  ["Analytics Dashboard","$0 extra","$149/mo","100%"],
  ["Priority 24/7 SLA","$100/mo your time","$499/mo","80%+"],
  ["Quarterly KB Update","$50 your time","$299/quarter","80%+"]
];

var CONTRACT_TIPS = [
  ["Minimum Contract Term","3-month min for Small, 6-month for Medium/BizPro, 12-month for Enterprise. Protects against churn after setup investment."],
  ["Setup Fee Non-Refundable","Collect 100% upfront before work begins. Covers your 8-60+ hours of onboarding labor. No exceptions."],

  ["Pause vs Cancel Policy","Allow one 30-day pause/yr at 50% rate. Prevents full cancellations during seasonal dips."],
  ["Price Escalator Clause","Include 5-8% annual price increase. Covers API cost inflation and your growing expertise."]
];

var CLAUSES = [
  ["Scope of Service","Define exactly what is included - channels, conversations/mo, integrations. Everything outside = extra charge."],
  ["Uptime SLA","99% for Medium/BizPro, 99.9% for Enterprise. Exclude Anthropic/Twilio outages from your liability."],
  ["Data Ownership","Client owns conversation data. Link2Talent retains aggregated/anonymized metrics for improvement."],
  ["API Cost Passthrough","If Anthropic raises prices more than 20%, you can pass through with 30 days notice."],
  ["Liability Cap","Cap total liability at 3 months of fees paid. Not liable for lost business or missed leads."],
  ["Acceptable Use","No medical/legal advice, discriminatory responses, or spam. Violations allow immediate termination."],
  ["Cancellation Notice","30-day written notice required. No refunds on setup fees or current billing period."],
  ["Intellectual Property","Link2Talent codebase and system prompts remain ours. Client gets a license, not ownership."]
];

var TABS=[{id:"tiers",l:"Pricing Tiers"},{id:"scale",l:"Scale Projections"},{id:"addons",l:"Add-Ons & Upsells"},{id:"contracts",l:"Contracts & Terms"}];
var tab="tiers", currentTier="small", showROI=false;
var roiStaff=1, roiWage=18, roiHrs=40;

function fmt(n){ return "$"+Math.round(n).toLocaleString(); }
function el(id){ return document.getElementById(id); }
function pct(rev,cost){ return Math.round(((rev-cost)/rev)*100); }
function setTab(id){ tab=id; rTabs(); rContent(); el("CT").scrollIntoView({behavior:"smooth",block:"start"}); }
function reCalc(){ rTabs(); rContent(); }

function rTabs(){
  el("TB").innerHTML = TABS.map(function(t){
    return "<button class=\"tab-btn"+(tab===t.id?" active":"")+"\" onclick=\"setTab('"+t.id+"')\">"+t.l+"</button>";
  }).join("");
}

function rTiers(){
  var t = TIERS[currentTier];
  var margin = pct(t.clientMo, t.avg);
  var annRev = t.clientSetup + t.clientMo*12;
  var annCost = t.setupLo + t.avg*12;
  var annProfit = annRev - annCost;
  var mWages = roiStaff*roiWage*roiHrs*4.33, mBen=mWages*.28, mTot=Math.round(mWages+mBen+200);
  var sav = mTot - t.clientMo, pb = sav>0 ? Math.ceil(t.clientSetup/sav) : null;

  var tierBtns = ["small","medium","bizpro","enterprise"].map(function(k){
    var tt = TIERS[k];
    var active = currentTier===k;
    return "<button style=\"flex:1;padding:10px 4px;border-radius:8px;border:2px solid "+(active?tt.color:"var(--border)")+";background:"+(active?tt.color:"var(--bg2)")+";color:"+(active?"#fff":"var(--muted)")+";font-weight:700;font-size:12px;cursor:pointer;font-family:inherit\" onclick=\"currentTier='"+k+"';reCalc()\">"+tt.label+"</button>";
  }).join("");

  var usageGrid = t.usage.map(function(u){
    return "<div style=\"background:#120E0A;border-radius:8px;padding:8px 10px\"><div style=\"font-size:10px;color:var(--dim)\">"+u[0]+"</div><div style=\"font-size:12.5px;font-weight:600;color:var(--text);margin-top:2px\">"+u[1]+"</div></div>";
  }).join("");

  var costRows = t.costs.map(function(c, i){
    var isFree = c[1]==="Free";
    return "<div class=\"cost-row\" style=\"background:"+( i%2===0?"rgba(255,255,255,.02)":"transparent" )+";\"><span style=\"color:var(--muted);font-size:12px\">"+c[0]+"</span><span style=\"font-weight:600;font-size:12px;color:"+(isFree?"var(--green)":"var(--text)")+"\">"+( isFree?"Free":c[1]+"-"+c[2])+"</span></div>";
  }).join("");

  var setupRows = t.setup.map(function(s, i){
    return "<div class=\"cost-row\" style=\"background:"+( i%2===0?"rgba(255,255,255,.02)":"transparent" )+";\"><span style=\"color:var(--muted);font-size:11px\">"+s[0]+"</span><span style=\"font-weight:600;font-size:11px;color:var(--text)\">"+s[1]+"-"+s[2]+"</span></div>";
  }).join("");

  var plStats = [["Total Revenue",fmt(annRev),"#D97706"],["Your Total Cost",fmt(annCost),"#F43F5E"],["Net Profit",fmt(annProfit),"#D97706"],["ROI",Math.round((annProfit/annCost)*100)+"%","#D97706"]].map(function(x){
    return "<div style=\"text-align:center\"><div style=\"font-size:9.5px;color:rgba(255,255,255,.4);margin-bottom:4px\">"+x[0]+"</div><div style=\"font-size:clamp(16px,4vw,20px);font-weight:800;color:"+x[2]+"\">"+x[1]+"</div></div>";
  }).join("");

  var roiSliders = [["roiStaff","Receptionists",1,5,1,roiStaff,""],["roiWage","Hourly Wage ($)",12,40,1,roiWage,"$"],["roiHrs","Hours/Week",20,40,5,roiHrs,""]].map(function(s){
    var key=s[0],lbl=s[1],min=s[2],max=s[3],step=s[4],val=s[5],pre=s[6];
    return "<div style=\"margin-bottom:14px\"><div class=\"slider-row-lbl\"><span style=\"color:var(--muted)\">"+lbl+"</span><span style=\"font-weight:700;color:var(--text)\">"+pre+val+"</span></div><input type=\"range\" min=\""+min+"\" max=\""+max+"\" step=\""+step+"\" value=\""+val+"\" oninput=\"window['"+key+"']=+this.value;reCalc()\"></div>";
  }).join("");

  var roiCards = [["Staff cost/mo",fmt(mTot),"#F43F5E"],["AI cost/mo",fmt(t.clientMo),t.color],["Monthly savings",sav>0?"+"+fmt(sav):"—","#D97706"]].map(function(x){
    return "<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center\"><div style=\"font-size:10px;color:var(--muted);margin-bottom:3px\">"+x[0]+"</div><div style=\"font-size:18px;font-weight:700;color:"+x[2]+"\">"+x[1]+"</div>"+(sav>0&&x[0].includes("savings")&&pb?"<div style=\"font-size:10px;color:var(--muted);margin-top:3px\">Paid back in "+pb+" mo</div>":"")+"</div>";
  }).join("");

  return "<div style=\"display:flex;gap:8px;margin-bottom:18px\">"+tierBtns+"</div>"
   +"<div class=\"card\" style=\"border-top:4px solid "+t.color+"\"><div style=\"font-size:19px;font-weight:800;color:"+t.color+";margin-bottom:2px\">"+t.label+"</div><div style=\"font-size:12px;color:var(--muted);margin-bottom:20px\">"+t.ex+"</div>"
   +"<div style=\"margin-bottom:20px\"><div style=\"font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px\">Typical Usage Profile</div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">"+usageGrid+"</div></div>"
   +"<div class=\"two-col\" style=\"margin-bottom:20px\">"
     +"<div><div style=\"font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px\">Your Monthly Cost</div>"
     +"<div style=\"border:1px solid var(--border);border-radius:var(--rs);overflow:hidden\">"+costRows
     +"<div style=\"padding:10px 12px;background:rgba(244,63,94,.1);border-top:2px solid var(--red)\"><div style=\"font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:2px\">Total Your Cost/mo</div><div style=\"font-size:20px;font-weight:800;color:var(--red)\">"+fmt(t.totLo)+"-"+fmt(t.totHi)+"</div></div></div></div>"
     +"<div><div style=\"font-size:10px;font-weight:700;color:"+t.color+";text-transform:uppercase;letter-spacing:1px;margin-bottom:8px\">Client Monthly Price</div>"
     +"<div style=\"border:2px solid "+t.color+";border-radius:var(--rs);overflow:hidden\">"
     +"<div style=\"padding:14px;background:rgba(196,102,16,.08)\"><div style=\"font-size:10px;color:var(--muted)\">Monthly retainer</div><div style=\"font-size:30px;font-weight:800;color:"+t.color+"\">"+fmt(t.clientMo)+"</div></div>"
     +"<div style=\"padding:10px 12px\"><div style=\"font-size:11px;color:var(--muted)\">Annual ("+t.disc+"% off)</div><div style=\"font-size:14px;font-weight:700;color:var(--text)\">"+fmt(Math.round(t.clientMo*12*(1-t.disc/100)))+"/yr</div><div style=\"font-size:11px;color:var(--green);margin-top:2px\">Client saves "+fmt(Math.round(t.clientMo*12*t.disc/100))+"/yr</div></div>"
     +"<div style=\"padding:10px 12px;border-top:1px solid var(--border)\"><div style=\"display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px\"><span style=\"color:var(--muted)\">Profit margin</span><span style=\"font-weight:700;color:"+(margin>=60?"var(--green)":"var(--gold)")+"\">"+margin+"%</span></div>"
     +"<div class=\"bar-wrap\"><div class=\"bar-fill\" style=\"width:"+margin+"%;background:"+(margin>=60?"#D97706":"#D97706")+";\"></div></div></div></div></div></div>"
   +"<div style=\"margin-bottom:20px\"><div style=\"font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px\">One-Time Setup</div>"
   +"<div class=\"two-col\"><div style=\"border:1px solid var(--border);border-radius:var(--rs);overflow:hidden\"><div style=\"padding:8px 12px;background:rgba(244,63,94,.1)\"><div style=\"font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase\">Your Setup Cost</div></div>"+setupRows
   +"<div style=\"padding:10px 12px;background:rgba(244,63,94,.1)\"><div style=\"font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:2px\">Total</div><div style=\"font-size:16px;font-weight:800;color:var(--red)\">"+fmt(t.setupLo)+"-"+fmt(t.setupHi)+"</div></div></div>"
   +"<div style=\"border:2px solid "+t.color+";border-radius:var(--rs);overflow:hidden\"><div style=\"padding:8px 12px;background:"+t.color+"\"><div style=\"font-size:10px;font-weight:700;color:#fff;text-transform:uppercase\">Client Setup Fee</div></div>"
   +"<div style=\"padding:20px 12px;text-align:center\"><div style=\"font-size:30px;font-weight:800;color:"+t.color+"\">"+fmt(t.clientSetup)+"</div><div style=\"font-size:11px;color:var(--muted);margin-top:4px\">one-time &middot; non-refundable</div>"
   +"<div style=\"font-size:12px;font-weight:600;color:var(--green);margin-top:8px\">Net profit: "+fmt(t.clientSetup-t.setupHi)+"-"+fmt(t.clientSetup-t.setupLo)+"</div></div></div></div></div>"
   +"<div class=\"navy\"><div style=\"font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px\">Year 1 P&amp;L &mdash; 1 Client</div><div class=\"four-col\">"+plStats+"</div></div>"
   +"<div style=\"display:flex;justify-content:flex-end;margin-top:16px\"><button onclick=\"showROI=!showROI;reCalc()\" style=\"padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:"+(showROI?"var(--green)":"var(--bg2)")+";color:"+(showROI?"#fff":"var(--muted)")+";font-size:12px;font-weight:600;cursor:pointer;font-family:inherit\">"+(showROI?"ROI Calc On":"Show Client ROI Calc")+"</button></div>"
   +(showROI?"<div style=\"background:#120E0A;border-radius:12px;padding:18px;margin-top:14px\"><div style=\"font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px\">Client ROI Calculator</div><div class=\"three-col\" style=\"margin-bottom:16px\">"+roiSliders+"</div><div class=\"three-col\">"+roiCards+"</div></div>":"")
   +"</div>";
}

function rScale(){
  var rows=[{tier:"Small",rev:497,cost:89,c:"#C46610"},{tier:"Medium",rev:997,cost:287,c:"#8A4800"},{tier:"Business Pro",rev:1997,cost:465,c:"#4F46E5"},{tier:"Enterprise",rev:3997,cost:1590,c:"#7C3AED"}];
  var clients=[1,3,5,10,20,50];
  var thead="<tr><th style=\"text-align:left\">Tier / Clients</th>"+clients.map(function(n){return "<th style=\"text-align:center\">"+n+"</th>";}).join("")+"</tr>";
  var tbody=rows.map(function(r){
    var revRow="<tr><td style=\"background:rgba(196,102,16,.06);font-weight:700;color:"+r.c+";font-size:12px\">"+r.tier+" Revenue</td>"+clients.map(function(n){return "<td style=\"text-align:center;background:rgba(196,102,16,.06);font-weight:700;color:"+r.c+"\">"+"$"+(r.rev*n).toLocaleString()+"</td>";}).join("")+"</tr>";
    var costRow="<tr><td style=\"background:rgba(244,63,94,.05);color:var(--red);font-size:12px\">"+r.tier+" Cost</td>"+clients.map(function(n){return "<td style=\"text-align:center;background:rgba(244,63,94,.05);color:var(--red)\">"+"$"+(r.cost*n).toLocaleString()+"</td>";}).join("")+"</tr>";
    var profRow="<tr><td style=\"background:rgba(217,119,6,.06);font-weight:700;color:var(--green);font-size:12px;border-bottom:2px solid var(--border)\">"+r.tier+" Net Profit</td>"+clients.map(function(n){return "<td style=\"text-align:center;background:rgba(217,119,6,.06);font-weight:700;color:var(--green);border-bottom:2px solid var(--border)\">"+"$"+((r.rev-r.cost)*n).toLocaleString()+"</td>";}).join("")+"</tr>";
    return revRow+costRow+profRow;
  }).join("");

  var snaps=[["10 Small Clients","$4,970","$890","$4,080","#C46610"],["10 Business Pro","$19,970","$4,650","$15,320","#4F46E5"],["5 Enterprise","$19,985","$7,950","$12,035","#7C3AED"]].map(function(x){
    return "<div class=\"navy\"><div style=\"font-size:10px;color:rgba(255,255,255,.4);margin-bottom:8px\">"+x[0]+"</div><div style=\"font-size:10px;color:rgba(255,255,255,.4)\">Revenue/mo</div><div style=\"font-size:20px;font-weight:800;color:"+x[4]+"\">"+x[1]+"</div><div style=\"font-size:10px;color:var(--green);font-weight:600;margin-top:6px\">Profit: "+x[3]+"/mo</div></div>";
  }).join("");

  var paths=[["All Small","25 clients x $408 net","25","#C46610"],["Business Pro","7 clients x $1,532 net","7","#4F46E5"],["Mixed Strategy","4 Pro + 2 BizPro + 2 Ent","varies","#7C3AED"]].map(function(x){
    return "<div style=\"background:rgba(255,255,255,.05);border-radius:8px;padding:12px;border:1px solid rgba(217,119,6,.2)\"><div style=\"font-size:12px;font-weight:700;color:"+x[3]+";margin-bottom:4px\">"+x[0]+"</div><div style=\"font-size:24px;font-weight:800;color:var(--green)\">"+x[2]+"</div><div style=\"font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4\">"+x[1]+"/mo</div></div>";
  }).join("");

  return "<div style=\"margin-bottom:22px\"><div class=\"sec-eye\">Projections</div><div class=\"sec-title\">Monthly Recurring Revenue Projections</div><div class=\"sec-sub\">What your business looks like as you scale &mdash; by client count and tier.</div></div>"
    +"<div style=\"overflow-x:auto;margin-bottom:24px\"><table><thead>"+thead+"</thead><tbody>"+tbody+"</tbody></table></div>"
    +"<div class=\"three-col\" style=\"margin-bottom:20px\">"+snaps+"</div>"
    +"<div style=\"background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);border-radius:14px;padding:18px\">"
    +"<div style=\"font-size:13px;font-weight:700;color:var(--green);margin-bottom:14px\">Path to $10,000/mo Net Profit</div>"
    +"<div class=\"three-col\">"+paths+"</div></div>";
}

function rAddons(){
  var headerCells=["Add-On Service","Your Cost","Client Price","Margin"].map(function(h){return "<div style=\"font-size:10px;font-weight:700;color:var(--mint);text-transform:uppercase;letter-spacing:.5px\">"+h+"</div>";}).join("");
  var addonRows=ADDONS.map(function(a,i){
    var bg=i%2===0?"var(--bg2)":"var(--bg)";
    return "<div class=\"addon-row\" style=\"background:"+bg+"\"><div style=\"font-size:12.5px;font-weight:600;color:var(--text)\">"+a[0]+"</div><div style=\"font-size:12px;color:var(--red)\">"+a[1]+"</div><div style=\"font-size:12px;font-weight:700;color:var(--teal)\">"+a[2]+"</div><div style=\"font-size:12px;font-weight:700;color:var(--green)\">"+a[3]+"</div></div>";
  }).join("");

  var bundles=[["Starter Bundle","+ $0/mo","Base plan only — get them in the door","#C46610"],["Growth Bundle","+$299/mo","Analytics + 1 extra channel","#D97706"],["Pro Bundle","+$648/mo","White-label + multilingual + priority SLA","#D97706"]].map(function(b){
    return "<div style=\"margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)\"><div style=\"display:flex;justify-content:space-between;margin-bottom:2px\"><span style=\"font-size:12.5px;font-weight:600;color:#fff\">"+b[0]+"</span><span style=\"font-size:12.5px;font-weight:700;color:"+b[3]+"\">"+b[1]+"</span></div><div style=\"font-size:11px;color:rgba(255,255,255,.4)\">"+b[2]+"</div></div>";
  }).join("");

  var timing=[["Month 1","Get them live — nothing else"],["Month 2","Show analytics data — pitch dashboard"],["Month 3","Review leads — pitch extra channel"],["Month 6","Review ROI — pitch annual + white-label"],["Month 12","Renewal — enterprise upgrade or 2nd location"]].map(function(u){
    return "<div style=\"display:flex;gap:10px;margin-bottom:9px\"><div style=\"font-size:10.5px;font-weight:700;color:var(--gold);min-width:58px\">"+u[0]+"</div><div style=\"font-size:11.5px;color:var(--muted);line-height:1.4\">"+u[1]+"</div></div>";
  }).join("");

  return "<div style=\"margin-bottom:22px\"><div class=\"sec-eye\">Upsells</div><div class=\"sec-title\">Add-On Services &amp; Upsells</div><div class=\"sec-sub\">Stack on top of any base plan to grow MRR per client with minimal extra work.</div></div>"
    +"<div style=\"border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:22px\"><div class=\"addon-header\">"+headerCells+"</div>"+addonRows+"</div>"
    +"<div class=\"two-col\"><div class=\"navy\"><div style=\"font-size:12px;font-weight:700;color:var(--mint);margin-bottom:12px\">Bundling Strategy</div>"+bundles+"</div>"
    +"<div style=\"background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);border-radius:var(--r);padding:18px\"><div style=\"font-size:12px;font-weight:700;color:var(--gold);margin-bottom:12px\">Upsell Timing</div>"+timing+"</div></div>";
}

function rContracts(){
  var tipCards=CONTRACT_TIPS.map(function(t){
    return "<div style=\"border:1px solid var(--border);border-radius:var(--rs);padding:14px\"><div style=\"font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:7px\">"+t[0]+"</div><div style=\"font-size:11.5px;color:var(--muted);line-height:1.6\">"+t[1]+"</div></div>";
  }).join("");

  var clauseCards=CLAUSES.map(function(c){
    return "<div class=\"clause\"><div style=\"font-size:11px;font-weight:700;color:var(--mint);margin-bottom:4px\">"+c[0]+"</div><div style=\"font-size:11px;color:var(--muted);line-height:1.5\">"+c[1]+"</div></div>";
  }).join("");

  var billingTiers=[
    {tier:"Small",color:"#C46610",items:["100% setup fee upfront","Monthly subscription on go-live","Auto-charge card on file","Invoice sent day before charge"]},
    {tier:"Med / BizPro",color:"#4F46E5",items:["50% setup upfront, 50% at go-live","Monthly auto-billed","Net-15 invoices accepted","Annual = 1 payment or quarterly"]},
    {tier:"Enterprise",color:"#7C3AED",items:["50% setup upfront, 50% at launch","Monthly or quarterly billing","ACH/wire for $5K+ payments","Annual review meeting included"]}
  ].map(function(b){
    var rows=b.items.map(function(item){return "<div class=\"billing-row\"><span style=\"color:"+b.color+";font-weight:700\">&rarr;</span>"+item+"</div>";}).join("");
    return "<div class=\"billing-card\"><div style=\"padding:9px 13px;background:"+b.color+"\"><div style=\"font-size:11.5px;font-weight:700;color:#fff\">"+b.tier+" &mdash; Billing</div></div><div style=\"padding:12px\">"+rows+"</div></div>";
  }).join("");

  return "<div style=\"margin-bottom:22px\"><div class=\"sec-eye\">Contracts</div><div class=\"sec-title\">Contract &amp; Terms Recommendations</div><div class=\"sec-sub\">Protect Link2Talent revenue and set clear expectations with every client.</div></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px\">"+tipCards+"</div>"
    +"<div class=\"navy\" style=\"margin-bottom:22px\"><div style=\"font-size:12px;font-weight:700;color:var(--mint);margin-bottom:14px\">Required Contract Clauses</div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">"+clauseCards+"</div></div>"
    +"<div style=\"font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px\">Billing Schedule by Tier</div>"
    +"<div class=\"three-col\">"+billingTiers+"</div>";
}

function rContent(){
  var map={tiers:rTiers,scale:rScale,addons:rAddons,contracts:rContracts};
  el("CT").innerHTML=(map[tab]||rTiers)();
}
rTabs();rContent();
</script>
</body>
</html>
